<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Astra · Login concluído</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0a0a'/%3E%3Cpath d='M16 3C16.8 11 21 15.2 29 16C21 16.8 16.8 21 16 29C15.2 21 11 16.8 3 16C11 15.2 15.2 11 16 3Z' fill='%23fafafa'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;padding:24px;background:#0a0a0a;color:#fafafa;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{width:100%;max-width:400px;padding:40px 32px 32px;border:1px solid #262626;border-radius:20px;text-align:center;animation:rise .5s cubic-bezier(.22,1,.36,1) both}
.logo{width:44px;height:44px;margin:0 auto 28px;display:block;opacity:.9}
.check{width:56px;height:56px;margin:0 auto 20px;display:grid;place-items:center;border-radius:50%;background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.35)}
.check svg{width:26px;height:26px;stroke:#10b981;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:26;stroke-dashoffset:26;animation:draw .5s .25s ease-out forwards}
h1{margin:0 0 8px;font-size:22px;font-weight:600;letter-spacing:-.02em}
p{margin:0;font-size:14px;line-height:1.5;color:#a3a3a3}
.open{display:inline-flex;align-items:center;justify-content:center;height:42px;margin-top:28px;padding:0 24px;border-radius:999px;background:#fafafa;color:#0a0a0a;font-size:14px;font-weight:600;text-decoration:none;transition:opacity .15s}
.open:hover{opacity:.88}
.open:focus-visible{outline:2px solid #fafafa;outline-offset:3px}
.hint{margin-top:18px;font-size:12px;color:#737373}
.bar{height:2px;margin:24px auto 0;width:120px;border-radius:2px;background:#262626;overflow:hidden}
.bar i{display:block;height:100%;width:40%;background:#fafafa;border-radius:2px;animation:slide 1.2s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
@media (prefers-reduced-motion:reduce){main,.check svg,.bar i{animation:none}.check svg{stroke-dashoffset:0}}
</style>
</head>
<body>
<main>
<svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3C16.8 11 21 15.2 29 16C21 16.8 16.8 21 16 29C15.2 21 11 16.8 3 16C11 15.2 15.2 11 16 3Z" fill="#fafafa"/></svg>
<div class="check"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
<h1>Login concluído</h1>
<p id="status">Abrindo o Astra no seu computador…</p>
<div class="bar" id="bar" aria-hidden="true"><i></i></div>
<a class="open" href="astra://auth?code={{code}}">Abrir o Astra</a>
<p class="hint">Depois que o app abrir, você pode fechar esta aba.</p>
</main>
<script>
location.href="astra://auth?code={{code}}";
setTimeout(function(){
document.getElementById("status").textContent="Se o Astra não abriu, use o botão abaixo.";
document.getElementById("bar").style.display="none";
},2500);
</script>
</body>
</html>
