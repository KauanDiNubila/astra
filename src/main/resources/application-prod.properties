spring.docker.compose.enabled=false
server.forward-headers-strategy=native
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
astra.jwt.secret=${ASTRA_JWT_SECRET}
astra.chat.encryption-key=${ASTRA_CHAT_ENCRYPTION_KEY}
astra.frontend-url=${ASTRA_FRONTEND_URL}
spring.security.oauth2.client.registration.google.client-id=${ASTRA_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${ASTRA_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.client-id=${ASTRA_GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${ASTRA_GITHUB_CLIENT_SECRET}
astra.github.connect-redirect-uri=${ASTRA_GITHUB_CONNECT_REDIRECT_URI}
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
astra.call.turn-secret=${ASTRA_TURN_SECRET}
astra.call.turn-urls=${ASTRA_TURN_URLS}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.connection-timeout=30000
