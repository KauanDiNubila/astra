spring.application.name=astra
spring.jpa.hibernate.ddl-auto=validate
# Desligado de propósito: sem isso, a conexão do pool fica presa durante
# toda a serialização JSON da resposta, não só durante a transação. Todos
# os controllers já devolvem DTO/record (nunca entidade crua), então não
# há acesso lazy fora de um @Transactional pra isso quebrar.
spring.jpa.open-in-view=false
spring.docker.compose.lifecycle-management=start-only
astra.jwt.secret=${ASTRA_JWT_SECRET:dev-secret-astra-change-me-in-production-0123456789}
astra.chat.encryption-key=${ASTRA_CHAT_ENCRYPTION_KEY:YXN0cmEtZGV2LWNoYW5nZS1tZS1pbi1wcm9kISEhISE=}
astra.jwt.expiration-minutes=15
astra.jwt.refresh-expiration-days=30
astra.cors.allowed-origins=${ASTRA_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
astra.frontend-url=${ASTRA_FRONTEND_URL:http://localhost:5173}
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB

spring.security.oauth2.client.registration.google.client-id=${ASTRA_GOOGLE_CLIENT_ID:unconfigured}
spring.security.oauth2.client.registration.google.client-secret=${ASTRA_GOOGLE_CLIENT_SECRET:unconfigured}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.github.client-id=${ASTRA_GITHUB_CLIENT_ID:unconfigured}
spring.security.oauth2.client.registration.github.client-secret=${ASTRA_GITHUB_CLIENT_SECRET:unconfigured}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

astra.github.connect-redirect-uri=${ASTRA_GITHUB_CONNECT_REDIRECT_URI:http://localhost:8080/github/connect/callback}
