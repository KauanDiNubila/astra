spring.application.name=astra
spring.jpa.hibernate.ddl-auto=validate
spring.docker.compose.lifecycle-management=start-only
astra.jwt.secret=${ASTRA_JWT_SECRET:dev-secret-astra-change-me-in-production-0123456789}
astra.jwt.expiration-minutes=1440
astra.cors.allowed-origins=${ASTRA_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB
